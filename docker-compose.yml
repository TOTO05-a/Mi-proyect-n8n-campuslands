version: "3.9"

# Sistema Inteligente de Gestión de Justificación de Inasistencias
# Docker Compose Enterprise Configuration

networks:
  justificaciones_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  n8n_data:
    driver: local
  logs_data:
    driver: local

services:

  # ──────────────────────────────────────────────
  # PostgreSQL — Base de datos principal
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: justificaciones_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5432:5432"
    networks:
      justificaciones_net:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ──────────────────────────────────────────────
  # Redis — Cache, Rate Limiting, Deduplicación
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: justificaciones_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      justificaciones_net:
        ipv4_address: 172.28.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # n8n — Motor de Automatización
  # ──────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: justificaciones_n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # n8n config
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${NGROK_PUBLIC_URL}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Auth
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      # Logs
      N8N_LOG_LEVEL: info
      N8N_LOG_OUTPUT: console,file
      N8N_LOG_FILE_LOCATION: /home/node/.n8n/logs/n8n.log
      # Timezone
      GENERIC_TIMEZONE: ${TIMEZONE}
      TZ: ${TIMEZONE}
      # Executions
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
      # External APIs (injected as env for use in n8n credentials)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      OCRSPACE_API_KEY: ${OCRSPACE_API_KEY}
      GOOGLE_SHEETS_ID: ${GOOGLE_SHEETS_ID}
    volumes:
      - n8n_data:/home/node/.n8n
      - logs_data:/home/node/.n8n/logs
    ports:
      - "5678:5678"
    networks:
      justificaciones_net:
        ipv4_address: 172.28.0.12

  # ──────────────────────────────────────────────
  # ngrok — Túnel público para webhooks
  # ──────────────────────────────────────────────
  ngrok:
    image: ngrok/ngrok:latest
    container_name: justificaciones_ngrok
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTH_TOKEN}
    command: http n8n:5678 --log=stdout --log-level=info
    ports:
      - "4040:4040"
    networks:
      justificaciones_net:
        ipv4_address: 172.28.0.13